---
- name: Instalar sudo
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Desplegar la política de sudo
  ansible.builtin.template:
    src: sudoers-hardening.j2
    dest: /etc/sudoers.d/00-hardening
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Quitar NOPASSWD de los ficheros de sudoers indicados
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: NOPASSWD:\s*
    replace: ""
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ accounts_nopasswd_files }}"

- name: Configurar caducidad de contraseñas y umask en login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: ^\s*{{ item.key }}\s
    line: "{{ item.key }}\t{{ item.value }}"
    mode: "0644"
  loop:
    - {key: PASS_MAX_DAYS, value: "{{ accounts_pass_max_days }}"}
    - {key: PASS_MIN_DAYS, value: "{{ accounts_pass_min_days }}"}
    - {key: PASS_WARN_AGE, value: "{{ accounts_pass_warn_age }}"}
    - {key: UMASK, value: "{{ accounts_umask }}"}

- name: Restringir su al grupo de administradores (pam_wheel)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: ^\s*#?\s*auth\s+(required|requisite)\s+pam_wheel\.so
    line: "auth       required   pam_wheel.so use_uid group={{ accounts_su_group }}"
    mode: "0644"
