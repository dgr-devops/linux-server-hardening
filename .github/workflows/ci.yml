---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (yamllint, ansible-lint, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install -r requirements.txt
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: shellcheck
        run: shellcheck roles/audit/files/hardening-audit.sh tests/container/run.sh

  syntax:
    name: Syntax check del playbook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Ansible
        run: pip install -r requirements.txt
      - name: ansible-playbook --syntax-check
        run: |
          ansible-playbook --syntax-check -i tests/container/inventory.yml site.yml
          ansible-playbook --syntax-check -i tests/container/inventory.yml audit.yml

  container-test:
    name: Test en contenedor (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12-slim"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Ansible
        run: pip install -r requirements.txt
      - name: Aplicar el playbook, comprobar idempotencia y auditoría
        run: tests/container/run.sh "${{ matrix.image }}"
      - name: Guardar informes antes/después
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore
